include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # 阶段 0 保持严格，避免把问题留到后续阶段
    avoid_print: error
  exclude:
    - build/**
    - windows/**
    - android/**

linter:
  rules:
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
