# Alembic configuration.
#
# NOTE: keep this file ASCII-only.
# configparser reads it with encoding="locale"; on a zh-CN Windows box the
# locale codec is GBK, so non-ASCII comments here crash every alembic command
# before it even starts.
#
# The database URL is intentionally NOT stored here: migrations/env.py reads it
# from the application settings (PETLIFE_DATABASE_URL / .env), so "the DB the
# app connects to" and "the DB migrations touch" can never drift apart.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
